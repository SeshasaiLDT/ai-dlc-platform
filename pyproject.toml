[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dlc-platform"
version = "0.1.0"
description = "Domain contracts and application services for the AI-DLC platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "a2a-sdk>=1.2,<1.3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "setuptools>=75,<82",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["contract: offline cross-integration trust and normalization contracts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
